# .github/workflows/snake_game.yml (ensure this file is on the 'Retail' branch)
name: Generate GitHub Snake

on:
  # Schedule the workflow to run daily at midnight UTC
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight UTC
  # Allow manual triggering of the workflow
  workflow_dispatch:
  # Optional: Trigger the workflow on pushes (uncomment if desired, adjust branch if needed)
  # push:
  #   branches:
  #     - Retail # Trigger on push to Retail branch

jobs:
  generate:
    runs-on: ubuntu-latest

    # --- Start of Added Permissions Block ---
    permissions:
      contents: write # Allow the job to push changes to the repository (specifically to the 'output' branch)
    # --- End of Added Permissions Block ---

    timeout-minutes: 10

    steps:
      # Step 1: Checkout the repository (working branch is usually the default branch, 'Retail' in your case)
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Generate the snake animations
      - name: Generate GitHub Contributions Snake Animations
        uses: Platane/snk@v3
        with:
          # GitHub username to generate the animation for
          # Uses the owner of the repository where the workflow runs (BhagyasriUddandam)
          github_user_name: ${{ github.repository_owner }}

          # Define the output files and their configurations, placed in 'dist' directory
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/ocean.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9
        # The GITHUB_TOKEN is implicitly used by the snk action if needed for API calls,
        # but it's the gh-pages action below critically needs the write permission.
        # env:
        #  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Usually not needed for snk itself

      # Step 3: Deploy the generated files from 'dist' to the 'output' branch
      - name: Deploy to output Branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          # This token now has the necessary 'contents: write' permission granted at the job level
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Directory containing the generated files to publish
          publish_dir: ./dist
          # Target branch to push the generated files to
          publish_branch: output
          # Commit message for the update commit
          commit_message: "Generate and commit snake animation [skip ci]"
          # Optional: Uncomment if you need to configure the committer's name/email
          # user_name: 'github-actions[bot]'
          # user_email: 'github-actions[bot]@users.noreply.github.com'
          # Optional: Uncomment if you want to keep other files already in the 'output' branch
          # keep_files: true
