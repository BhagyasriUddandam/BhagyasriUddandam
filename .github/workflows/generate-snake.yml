# GitHub Action for generating a contribution graph with a snake eating your contributions
name: Generate Snake Animation

on:
  # Run automatically on schedule (e.g., every 12 hours)
  schedule:
    - cron: "0 */12 * * *" # Runs at minute 0 past every 12th hour.

  # Allows you to manually run this workflow from the Actions tab
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out the repository so the action can write to it
      - uses: actions/checkout@v3

      # Step 2: Generate the snake animation SVG files
      - uses: Platane/snk@v3
        id: snake-gif # Optional ID for the step
        with:
          # GitHub username whose contributions to use
          # Defaults to the repository owner, so this line is technically optional for profile repos
          github_user_name: ${{ github.repository_owner }}

          # Specify the output files
          # ?palette=github-light uses the standard light GitHub contribution colors
          # ?palette=github-dark uses the standard dark GitHub contribution colors
          # Multiple files can be generated by listing them on separate lines
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=orange # Optional: change snake color for dark mode

      # Step 3: Commit the generated SVG files back to the repository
      # Uses the gh-pages action, configured to push to the same branch
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          # The directory where the snake files were generated (must match 'outputs' path above)
          build_dir: dist
          # The branch to push the generated files to (usually 'main' or 'master')
          target_branch: main # Change to 'master' if that's your default branch name
        env:
          # A token is required to push to the repository
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
